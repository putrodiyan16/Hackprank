<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Web Interaktif</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Gaya untuk gambar umpan */
        #umpan {
            cursor: pointer;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        #umpan:hover {
            transform: scale(1.05);
        }

        /* Layar Fake Hack (Awalnya Tersembunyi) */
        #layar-hack {
            display: none; /* Sembunyi */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            box-sizing: border-box;
            z-index: 9999;
        }

        .teks-berjalan {
            white-space: pre-wrap;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="kontainer">
        <h2 style="text-align: center;">Klik gambar untuk melihat hadiah</h2>
        <img id="umpan" src="https://picsum.photos/300/200" alt="Hadiah">
    </div>

    <div id="layar-hack">
        <div class="teks-berjalan" id="log-hacker"></div>
    </div>

    <script>
        const gambar = document.getElementById('umpan');
        const layarHack = document.getElementById('layar-hack');
        const logHacker = document.getElementById('log-hacker');

        // Data teks yang akan dimunculkan seolah-olah sedang hack
        const pesan = [
            "> Initializing exploit...",
            "> Connecting to server 192.168.1.1...",
            "> Accessing root database...",
            "> Downloading private_files.zip (45%)",
            "> System corrupted...",
            "> Bypassing firewall...",
            "> WARNING: ADMIN DETECTED!",
            "> Encryption key: 0x88234FF...",
            "> Hacking complete. Just kidding! :P"
        ];

        // Fungsi untuk menjalankan teks satu per satu
        function jalankanTeks(i = 0) {
            if (i < pesan.length) {
                logHacker.innerHTML += pesan[i] + "<br>";
                setTimeout(() => jalankanTeks(i + 1), 600);
            }
        }

        // Event Listener: Saat gambar diklik
        gambar.addEventListener('click', () => {
            // Tampilkan layar hitam
            layarHack.style.display = 'block';
            
            // Opsional: Buat jadi Fullscreen agar lebih nyata
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // Mulai jalankan teks palsu
            jalankanTeks();
        });

        // Klik layar hitam untuk keluar
        layarHack.addEventListener('click', () => {
            layarHack.style.display = 'none';
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
            logHacker.innerHTML = ""; // Reset teks
        });
    </script>
</body>
</html>
