<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Latihan Web Interaktif</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Gaya untuk gambar umpan */
        #umpan {
            cursor: pointer;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        #umpan:hover {
            transform: scale(1.05);
        }

        /* Layar Fake Hack */
        #layar-hack {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            box-sizing: border-box;
            z-index: 9999;
            overflow-y: auto; /* Agar bisa di-scroll */
            scroll-behavior: smooth;
        }

        .teks-berjalan {
            white-space: pre-wrap;
            word-wrap: break-word;
            padding-bottom: 50px; /* Ruang tambahan di bawah agar tidak mentok */
        }
    </style>
</head>
<body>

    <div id="kontainer">
        <h2 style="text-align: center;">Klik gambar untuk melihat hadiah</h2>
        <img id="umpan" src="https://picsum.photos/300/200" alt="Hadiah">
    </div>

    <div id="layar-hack">
        <div class="teks-berjalan" id="log-hacker"></div>
    </div>

    <script>
        const gambar = document.getElementById('umpan');
        const layarHack = document.getElementById('layar-hack');
        const logHacker = document.getElementById('log-hacker');

        const pesan = [
            "> Initializing exploit mechanism...",
            "> Establishing secure connection to 192.168.1.1...",
            "> Attempting to bypass SSL certificate...",
            "> Connection established via Proxy 103.22.201.2...",
            "> Searching for administrative vulnerabilities...",
            "> Found entry point at port 8080...",
            "> Injecting SQL payload: ' OR 1=1 --",
            "> Accessing root database directory...",
            "> Loading kernel modules...",
            "> Cracking MD5 hash: a8fdf67b...",
            "> Password found: **********",
            "> Downloading sensitive_data.zip (12%)",
            "> Downloading sensitive_data.zip (34%)",
            "> Downloading sensitive_data.zip (67%)",
            "> Downloading sensitive_data.zip (98%)",
            "> Transfer complete.",
            "> Bypassing firewall (layer 7)...",
            "> WARNING: Security protocol detected!",
            "> Counter-trace initiated...",
            "> Redirecting IP to internal loopback...",
            "> Overriding system permissions...",
            "> Accessing webcam drivers...",
            "> Capturing buffer stream...",
            "> Encrypting local drive (AES-256)...",
            "> [DANGER] SYSTEM OVERHEAT DETECTED!",
            "> Primary CPU at 98 degrees...",
            "> Forcing fan speed to 100%...",
            "> Initializing cleanup protocol...",
            "> Deleting temporary logs...",
            "> Downloading update_v2.zip (15%)",
            "> Downloading update_v2.zip (48%)",
            "> Downloading update_v2.zip (82%)",
            "> Update complete.",
            "> Finalizing system override...",
            "> Deleting footprints...",
            "> [SUCCESS] Hacking simulation complete.",
            "> ---------------------------------------",
            "> STATUS: YOUR PC HAS BEEN HACKED!",
            "> ---------------------------------------",
            "> Just kidding! Ini cuma simulasi HTML."
        ];

        function jalankanTeks(i = 0) {
            if (i < pesan.length) {
                // Tambah teks
                logHacker.innerHTML += pesan[i] + "<br>";
                
                // AUTO-SCROLL: Paksa layar scroll ke posisi paling bawah
                layarHack.scrollTop = layarHack.scrollHeight;
                
                // Jeda waktu antar baris (400ms agar durasi terasa pas)
                setTimeout(() => jalankanTeks(i + 1), 400);
            }
        }

        gambar.addEventListener('click', () => {
            layarHack.style.display = 'block';
            
            // Masuk Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                document.documentElement.webkitRequestFullscreen();
            }

            jalankanTeks();
        });

        // Klik layar hitam untuk menutup (reset)
        layarHack.addEventListener('click', () => {
            layarHack.style.display = 'none';
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            }
            logHacker.innerHTML = ""; 
        });
    </script>
</body>
</html>
